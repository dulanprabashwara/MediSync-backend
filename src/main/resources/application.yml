spring:
  application:
    name: medisync-api
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_IMAGE_BYTES:5242880B}
      max-request-size: ${MEDIA_MAX_IMAGE_BYTES:5242880B}
  datasource:
    url: jdbc:postgresql://${DB_HOST:db.cgekbpqwyyfpvcejydet.supabase.co}:6543/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 2
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

medisync:
  security:
    supabase-url: ${SUPABASE_URL:https://cgekbpqwyyfpvcejydet.supabase.co}
    jwks-url: ${SUPABASE_JWKS_URL:https://cgekbpqwyyfpvcejydet.supabase.co/auth/v1/.well-known/jwks.json}
    audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  appointments:
    minimum-lead-minutes: ${APPOINTMENT_MIN_LEAD_MINUTES:0}
  media:
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnZWticHF3eXlmcHZjZWp5ZGV0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzE5NjI5MCwiZXhwIjoyMTAyNzcyMjkwfQ.NW4m9TGRrys2yfAchIoZ-o6sR8dkUnd50__lqnmZnAE}
    bucket: ${SUPABASE_STORAGE_BUCKET:medisync-private-media}
    signed-url-seconds: ${MEDIA_SIGNED_URL_SECONDS:300}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:5242880}
  prescriptions:
    payment:
      currency: ${DOCTOR_FEE_CURRENCY:LKR}

logging:
  level:
    org.springframework.security: INFO
